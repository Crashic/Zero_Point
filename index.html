<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Тренировочный двор</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap">
<style>
/* Layout: full-screen game. Pixel-art arena on a canvas; HUD panels in carved-wood frames with gold trim float over it:
   unit frame top-left, minimap + buttons top-right, action bar bottom-centre, chat log bottom-left, game windows as overlays. */
:root{
  --edge:#110a04; --edge2:#2a1a0c; --wood:#3b2816; --wood2:#33220f; --wood-hi:#6a4826;
  --gold:#e2b14f; --gold-dk:#7d5a20; --text:#f4e4bd; --muted:#bea67a; --name:#a8dcff;
  --green:#8fd66a; --red:#ec7a62; --inset:#170f07; --thread:#6e5634;
  --f:"Pixelify Sans","PT Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:#0d0a06;color:var(--text)}
body{font-family:var(--f);font-size:14px;line-height:1.35;touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
.game{position:relative;height:100%;overflow:hidden;background:#2f5524}
#arena{position:absolute;inset:0;width:100%;height:100%;display:block}
.ol{text-shadow:1px 0 #000,-1px 0 #000,0 1px #000,0 -1px #000,1px 1px #000}

.frame{background:repeating-linear-gradient(0deg,var(--wood) 0 3px,var(--wood2) 3px 6px);
  border:2px solid var(--edge);
  box-shadow:inset 0 0 0 1px var(--gold-dk),inset 0 0 0 2px var(--gold),inset 0 0 0 4px var(--edge2),0 3px 0 rgba(0,0,0,.45)}

.hud-top{position:absolute;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none;z-index:2}
.hud-top > *{pointer-events:auto}
.unit{display:flex;gap:9px;padding:8px 10px 8px 8px;align-items:center;min-width:0;max-width:340px;flex:1 1 auto;cursor:pointer}
#portrait{width:54px;height:54px;flex:none;image-rendering:pixelated;border:2px solid var(--edge);box-shadow:0 0 0 1px var(--gold)}
.unit-info{display:grid;gap:4px;min-width:0;flex:1}
.unit-name{font-weight:700;font-size:15px;color:var(--name);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.unit-name small{color:var(--muted);font-weight:400;font-size:12px}
.pbar{position:relative;height:15px;background:var(--inset);border:2px solid var(--edge);box-shadow:inset 0 0 0 1px #5d4419;overflow:hidden}
.pbar i{position:absolute;left:0;top:0;bottom:0;width:0;transition:width .2s steps(4)}
.pbar.gold i{background:linear-gradient(#ffe08a 0 35%,#e3a43a 35% 100%)}
.pbar.blue i{background:linear-gradient(#b4e8ff 0 35%,#3e8fd8 35% 100%)}
.pbar.gold::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(5% - 1px),rgba(23,15,7,.85) calc(5% - 1px) 5%)}
.pbar span{position:relative;z-index:1;display:block;text-align:center;font-size:11px;line-height:11px;color:#fff;font-variant-numeric:tabular-nums}
.hud-tr{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
.mini{padding:6px 6px 4px;display:grid;gap:2px}
#minimap{display:block;width:124px;image-rendering:pixelated;border:2px solid var(--edge)}
.mini-label{font-size:11px;text-align:center;color:var(--gold)}
.btn-row{display:flex;gap:4px}
.ibtn{all:unset;box-sizing:border-box;cursor:pointer;min-width:40px;height:40px;padding:0 9px;display:inline-grid;place-items:center;
  font-family:var(--f);font-size:14px;font-weight:700;color:var(--text);background:linear-gradient(var(--wood-hi),#3e2914);
  border:2px solid var(--edge);box-shadow:inset 0 0 0 1px var(--gold-dk),inset 0 2px 0 rgba(255,220,150,.22),0 2px 0 rgba(0,0,0,.5)}
.ibtn:hover{background:linear-gradient(#7a5530,#4a3118)}
.ibtn:active{transform:translateY(1px)}
.ibtn svg{width:18px;height:18px;display:block}
.ibtn:focus-visible,.slot:focus-visible,.tab:focus-visible,.unit:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.hud-bottom{position:absolute;left:8px;right:8px;bottom:8px;display:flex;justify-content:center;pointer-events:none;z-index:2}
.actionbar{pointer-events:auto;display:flex;align-items:center;gap:6px;padding:9px 10px}
.slot{all:unset;box-sizing:border-box;position:relative;width:58px;height:58px;cursor:pointer;display:grid;place-items:center;
  background:radial-gradient(circle at 50% 40%,#2e2012,#120b05);border:2px solid var(--edge);box-shadow:inset 0 0 0 1px #6a4c1c}
.slot svg{width:32px;height:32px;color:#e9dcc0;margin-top:-8px}
.slot[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--gold),0 0 12px rgba(242,196,90,.55)}
.slot[aria-pressed="true"] svg{color:#ffd877}
.slot .pct{position:absolute;left:0;right:0;bottom:3px;text-align:center;font-size:11px;color:#fff;font-variant-numeric:tabular-nums}
.slot .key{position:absolute;left:4px;top:2px;font-size:10px;color:var(--muted)}
.slot .badge{position:absolute;right:-6px;top:-6px;min-width:18px;height:18px;padding:0 3px;box-sizing:border-box;background:var(--green);color:#10200a;font-size:11px;font-weight:700;display:grid;place-items:center;border:2px solid var(--edge)}
.slot .badge[hidden]{display:none}
.slot .cd{position:absolute;inset:0;background:conic-gradient(rgba(0,0,0,.58) calc(var(--cd,0) * 1turn),transparent 0);pointer-events:none}
.slot.skills svg{color:var(--gold)}
.sep{width:2px;align-self:stretch;background:var(--edge);box-shadow:1px 0 0 var(--gold-dk);margin:2px 3px}

.chat{position:absolute;left:8px;bottom:calc(var(--bar-h,80px) + 16px);z-index:2;width:min(400px,calc(100% - 16px));max-height:70px;overflow:hidden;box-sizing:border-box;
  margin:0;padding:4px 8px;list-style:none;display:flex;flex-direction:column-reverse;gap:1px;
  background:rgba(10,7,3,.55);border:1px solid rgba(226,177,79,.35);font-size:12px;line-height:1.3;cursor:pointer}
.chat.open{max-height:220px;overflow:auto;background:rgba(10,7,3,.85)}
.chat li{display:block}
.chat time{color:var(--muted);margin-right:5px}
.chat li.gold span{color:var(--gold)}
.chat li.miss span{color:var(--muted)}
.chat li.sys span{color:var(--name)}

.banner{position:absolute;left:0;right:0;top:42%;text-align:center;font-size:34px;font-weight:700;color:var(--gold);z-index:3;pointer-events:none}

.layer{position:absolute;inset:0;z-index:5;background:rgba(5,3,1,.62);display:grid;place-items:center;padding:10px}
.window{width:min(900px,100%);max-height:100%;display:flex;flex-direction:column;min-height:0;box-sizing:border-box}
.window.small{width:min(420px,100%)}
.win-head{display:flex;align-items:center;gap:8px;padding:8px 8px 7px 14px;border-bottom:2px solid var(--edge);box-shadow:0 1px 0 var(--gold-dk)}
.win-head h2{flex:1;margin:0;font-size:19px;font-weight:700;color:var(--gold);text-align:center;letter-spacing:.03em}
.win-body{overflow:auto;padding:12px 14px 14px;display:grid;gap:12px;min-height:0}
.inset{background:rgba(16,10,4,.75);border:2px solid var(--edge);box-shadow:inset 0 0 0 1px #4a3415;padding:10px 12px}

.tabs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.tab{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;gap:6px;align-items:center;padding:6px 12px;min-height:36px;font-size:14px;font-weight:600;
  background:linear-gradient(#4e351c,#2e1f0f);border:2px solid var(--edge);box-shadow:inset 0 0 0 1px var(--gold-dk);color:var(--text)}
.tab[aria-selected="true"]{background:linear-gradient(#7a5326,#4a3014);box-shadow:inset 0 0 0 1px var(--gold);color:#ffe3a0}
.tab b{background:var(--green);color:#10200a;font-size:11px;padding:0 5px;border:1px solid var(--edge)}
.web-body{display:grid;grid-template-columns:minmax(0,470px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:760px){.web-body{grid-template-columns:minmax(0,1fr)}}
.web-svg{width:100%;max-width:470px;aspect-ratio:1;display:block;margin-inline:auto}
.web-svg .thread{fill:none;stroke:var(--thread);stroke-width:1.3}
.web-svg .thread.faint{stroke-width:.7;opacity:.55}
.web-svg .lit{fill:none;stroke:#f2c45a;stroke-width:3;stroke-linecap:round}
.web-svg .node{cursor:pointer}
.web-svg .hit{fill:transparent}
.web-svg .node circle.b,.web-svg .node path.b{fill:#1a120a;stroke:var(--thread);stroke-width:1.8}
.web-svg .node .ic{fill:none;stroke:var(--muted);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.web-svg .node .ic.fill{fill:var(--muted);stroke:none}
.web-svg .node.reach circle.b,.web-svg .node.reach path.b{stroke:var(--muted);stroke-dasharray:3 3}
.web-svg .node.avail circle.b,.web-svg .node.avail path.b{stroke:var(--green);stroke-width:2.6}
.web-svg .node.avail .ic{stroke:var(--green)} .web-svg .node.avail .ic.fill{fill:var(--green)}
.web-svg .node.learned circle.b,.web-svg .node.learned path.b{fill:#f2c45a;stroke:#ffe7a6}
.web-svg .node.learned .ic{stroke:#2a1a08} .web-svg .node.learned .ic.fill{fill:#2a1a08}
.web-svg .node.locked{opacity:.5}
.web-svg .sel{fill:none;stroke:#fff3d0;stroke-width:1.6;stroke-dasharray:4 3}
.web-svg .core circle{fill:#f2c45a;stroke:#ffe7a6}
.web-svg .core svg{color:#2a1a08}
.web-svg .node:focus-visible{outline:none}
.web-svg .node:focus-visible circle.b,.web-svg .node:focus-visible path.b{stroke:#fff;stroke-width:2.6}
@media (prefers-reduced-motion:no-preference){.web-svg .node.avail circle.b,.web-svg .node.avail path.b{animation:pulse 1.4s steps(2) infinite}}
@keyframes pulse{50%{stroke-opacity:.35}}
.web-legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);justify-content:center;margin-top:6px}
.web-legend svg{width:15px;height:15px;vertical-align:-3px;margin-right:4px}
.detail{display:grid;gap:10px;align-content:start;min-width:0}
.pts-line{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13.5px;color:var(--muted)}
.pts-line b{color:var(--text);font-weight:600}
.card{display:grid;gap:5px}
.card .kind{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.card h3{margin:0;font-size:19px;color:#ffe3a0;font-weight:700}
.card .eff{font-size:14.5px}
.card .state{font-size:13px;color:var(--muted)}
.gbtn{all:unset;box-sizing:border-box;cursor:pointer;text-align:center;padding:9px 18px;min-height:42px;font-family:var(--f);font-size:15px;font-weight:700;color:#2a1a08;
  background:linear-gradient(#ffd877 0 40%,#e0a53b 40%);border:2px solid var(--edge);box-shadow:inset 0 0 0 1px #fff0b8,0 2px 0 rgba(0,0,0,.5)}
.gbtn:disabled{filter:grayscale(.85) brightness(.6);cursor:not-allowed}
.gbtn:focus-visible{outline:2px solid #fff;outline-offset:2px}
.gbtn.red{background:linear-gradient(#ff9b84 0 40%,#c9533c 40%);box-shadow:inset 0 0 0 1px #ffd0c4,0 2px 0 rgba(0,0,0,.5)}
.totals{display:grid;gap:3px;font-size:13.5px}
.totals h4{margin:0 0 2px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.totals div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed #4a3415;padding-block:3px}
.totals div span:last-child{color:#ffd877;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:1fr auto;gap:4px 14px;font-size:14px}
.stats span:nth-child(even){color:#ffd877;text-align:right;font-variant-numeric:tabular-nums}
.menu-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.menu-row .ibtn[aria-pressed="true"]{background:linear-gradient(#ffd877 0 40%,#e0a53b 40%);color:#2a1a08;text-shadow:none}
.hint{margin:0;font-size:13px;color:var(--muted)}

@media (max-width:600px){
  .unit{padding:6px 8px 6px 6px;gap:7px;max-width:250px}
  #portrait{width:46px;height:46px}
  .unit-name{font-size:14px}
  #minimap{width:78px}
  .mini-label{font-size:10px;max-width:78px}
  .ibtn{min-width:38px;height:38px;padding:0 7px}
  .actionbar{gap:5px;padding:7px 8px}
  .slot{width:54px;height:54px}
  .slot svg{width:30px;height:30px}
  .slot .key{display:none}
  .chat{font-size:11.5px;max-height:58px}
  .win-body{padding:10px}
}
</style>
</head>
<body>

<div class="game" id="game">
  <canvas id="arena" aria-label="Тренировочная площадка"></canvas>

  <div class="hud-top" id="hud-top">
    <div class="frame unit" id="unit" role="button" tabindex="0" aria-label="Открыть паутину навыков">
      <canvas id="portrait" width="32" height="32"></canvas>
      <div class="unit-info">
        <div class="unit-name ol" id="unit-name">Аэлис</div>
        <div class="pbar gold"><i id="bar-m"></i><span class="ol" id="txt-m"></span></div>
        <div class="pbar blue"><i id="bar-a"></i><span class="ol" id="txt-a"></span></div>
      </div>
    </div>
    <div class="hud-tr">
      <div class="frame mini"><canvas id="minimap" width="64" height="38"></canvas><div class="mini-label ol">Тренировочный двор</div></div>
      <div class="btn-row">
        <button class="ibtn" id="pause" type="button" aria-label="Пауза"></button>
        <button class="ibtn ol" id="speed" type="button" aria-label="Скорость игры">×1</button>
        <button class="ibtn" id="menu-btn" type="button" aria-label="Меню"><svg viewBox="0 0 16 16" shape-rendering="crispEdges" fill="currentColor"><rect x="2" y="3" width="12" height="2"/><rect x="2" y="7" width="12" height="2"/><rect x="2" y="11" width="12" height="2"/></svg></button>
      </div>
    </div>
  </div>

  <ol class="chat ol" id="log" aria-label="Журнал"></ol>
  <div class="banner ol" id="banner" hidden>Пауза</div>

  <div class="hud-bottom">
    <div class="frame actionbar" id="actionbar"></div>
  </div>

  <div class="layer" id="win-skills" hidden>
    <div class="frame window" role="dialog" aria-labelledby="ws-title">
      <div class="win-head"><span style="width:40px"></span><h2 class="ol" id="ws-title">Паутина навыков</h2><button class="ibtn close" type="button" aria-label="Закрыть"><svg viewBox="0 0 16 16" shape-rendering="crispEdges" fill="currentColor"><path d="M3 3h2v2H3zM5 5h2v2H5zM7 7h2v2H7zM9 9h2v2H9zM11 11h2v2h-2zM11 3h2v2h-2zM9 5h2v2H9zM5 9h2v2H5zM3 11h2v2H3z"/></svg></button></div>
      <div class="win-body">
        <div class="tabs" role="tablist" id="tabs"></div>
        <div class="web-body">
          <div>
            <svg class="web-svg" id="web" viewBox="-250 -250 500 500" role="group" aria-label="Паутина навыков"></svg>
            <div class="web-legend" id="web-legend"></div>
          </div>
          <div class="detail">
            <div class="pts-line inset" id="pts-line"></div>
            <div class="card inset" id="node-card"></div>
            <div class="totals inset" id="totals"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="layer" id="win-menu" hidden>
    <div class="frame window small" role="dialog" aria-labelledby="wm-title">
      <div class="win-head"><span style="width:40px"></span><h2 class="ol" id="wm-title">Меню</h2><button class="ibtn close" type="button" aria-label="Закрыть"><svg viewBox="0 0 16 16" shape-rendering="crispEdges" fill="currentColor"><path d="M3 3h2v2H3zM5 5h2v2H5zM7 7h2v2H7zM9 9h2v2H9zM11 11h2v2h-2zM11 3h2v2h-2zM9 5h2v2H9zM5 9h2v2H5zM3 11h2v2H3z"/></svg></button></div>
      <div class="win-body">
        <div class="inset stats" id="stats"></div>
        <div class="inset" style="display:grid;gap:8px">
          <span>Скорость тренировки</span>
          <div class="menu-row" id="speed-row"></div>
        </div>
        <p class="hint" id="controls-hint"></p>
        <button class="gbtn red" type="button" id="reset" data-armed="false">Сбросить прогресс</button>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
// ================= данные =================
let W = 960, H = 560, portrait = false;
const MAX = 10000, STEP = 500, START_ACC = 0.10;
const HERO_NAME = 'Аэлис';
const WEAPONS = {
  sword:  {name:'Меч',    acc4:'меч',    type:'melee', range:[40,54],   cd:0.95, anim:0.32},
  dagger: {name:'Кинжал', acc4:'кинжал', type:'melee', range:[35,43],   cd:0.5,  anim:0.2},
  bow:    {name:'Лук',    acc4:'лук',    type:'arrow', range:[170,320], cd:1.35, anim:0.45, speed:560},
  staff:  {name:'Посох',  acc4:'посох',  type:'orb',   range:[120,240], cd:1.7,  anim:0.55, speed:320},
};
const ORDER = ['sword','dagger','bow','staff'];
const ICONS = {
  sword:'<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square" stroke-linejoin="miter"><path d="M36 6h6v6L20 34l-6-6z"/><path d="M11 25l12 12M14 34l-6 6M8 36l4 4"/></svg>',
  dagger:'<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square" stroke-linejoin="miter"><path d="M38 10l-14 18-4-4z"/><path d="M17 23l8 8M21 27l-8 8M11 37l2 2"/></svg>',
  bow:'<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square" stroke-linejoin="miter"><path d="M12 6c18 4 30 16 30 36"/><path d="M12 6l30 36" stroke-width="1.5"/><path d="M8 40l26-26M30 12h5v5"/></svg>',
  staff:'<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square" stroke-linejoin="miter"><path d="M12 42l20-24"/><circle cx="35" cy="13" r="6"/><path d="M35 3v3M44 13h-2M41 6l-2 2"/></svg>',
};
const BOOK = '<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square"><circle cx="24" cy="24" r="4" fill="currentColor"/><path d="M24 6v36M8 15l32 18M8 33l32-18"/><path d="M24 14l9 5v10l-9 5-9-5V19z" stroke-width="2"/></svg>';
const ICON_PAUSE = '<svg viewBox="0 0 16 16" shape-rendering="crispEdges" fill="currentColor"><rect x="3" y="2" width="4" height="12"/><rect x="9" y="2" width="4" height="12"/></svg>';
const ICON_PLAY  = '<svg viewBox="0 0 16 16" shape-rendering="crispEdges" fill="currentColor"><path d="M4 2h2v12H4zM6 4h2v8H6zM8 5h2v6H8zM10 7h2v2h-2z"/></svg>';
const SPEEDS = [1,2,4,8,16];

const VALS = {acc:[0.015,0.02,0.03,0.05], spd:[0.04,0.06,0.08,0.12], dbl:[0.03,0.04,0.05,0.08], move:[0.06,0.08,0.1,0.15], focus:[1,1,1,2]};
const pc = v => (Math.round(v*1000)/10).toString().replace('.',',');
const dblWord = k => k==='bow'?'второго выстрела':k==='staff'?'второй сферы':'двойного удара';
const STAT = {
  acc:  {label:'Точность',       fmt:v=>'+'+pc(v)+'%', txt:v=>`+${pc(v)}% к точности`},
  spd:  {label:'Скорость атаки', fmt:v=>'+'+pc(v)+'%', txt:v=>`+${pc(v)}% к скорости атаки`},
  dbl:  {label:'Шанс повтора',   fmt:v=>'+'+pc(v)+'%', txt:(v,k)=>`+${pc(v)}% к шансу ${dblWord(k)}`},
  move: {label:'Скорость бега',  fmt:v=>'+'+pc(v)+'%', txt:v=>`+${pc(v)}% к скорости бега`},
  focus:{label:'Атак с позиции', fmt:v=>'+'+v,         txt:v=>`+${v} ${v===1?'атака':'атаки'} с одной позиции перед перебежкой`},
};
const KEYS = {
  whirl:'Каждая 5-я атака превращается в круговой удар, который всегда попадает.',
  riposte:'Четверть промахов превращается в попадание ответным ударом.',
  flurry:'После попадания 35% шанс сразу ударить снова, без перезарядки.',
  shadowstep:'Героиня бежит на новую позицию в 1,8 раза быстрее.',
  volley:'Каждый 4-й выстрел выпускает три стрелы веером.',
  eagle:'Дальность до манекена больше не снижает точность.',
  arcane:'Перезарядка посоха короче на 20%, сферы летят на 40% быстрее.',

const TREE = {
  sword:[

    {stat:'dbl',  names:['Обратный удар','Связка','Двойной рубящий','Каскад']},
    {stat:'move', names:['Шаг вперёд','Подшаг','Боевая походка','Натиск']},
    {stat:'focus',names:['Стойка','Упор','Выдержка','Ответный удар'], key:'riposte'},

    {stat:'dbl',  names:['Вторая стрела','Сдвоенный выстрел','Пара оперений','Ливень стрел']},
    {stat:'move', names:['Лёгкий шаг','Смена позиции','Охотничий бег','Следопыт']},

    {stat:'dbl',  names:['Эхо','Отражение','Двойная сфера','Резонанс']},
    {stat:'move', names:['Поступь','Левитация','Скольжение','Мерцание']},
    {stat:'focus',names:['Медитация','Круг силы','Якорь','Самонаведение'], key:'homing'},
    {stat:'acc',  names:['Чтение потоков','Руна прицела','Око','Звёздный взгляд']},
  ],
};
const NODES = {};
for (const k of ORDER){ NODES[k]={}; TREE[k].forEach((sp,s)=>{ for(let r=1;r<=4;r++){ const key=(r===4&&sp.key)?sp.key:null; NODES[k][s+'-'+r]={id:s+'-'+r,s,r,name:sp.names[r-1],stat:sp.stat,val:VALS[sp.stat][r-1],key}; } }); }
const NODE_COUNT = 24;

// ================= состояние =================
const STORE = 'training-yard-v2';
const fresh = () => Object.fromEntries(ORDER.map(k => [k,{m:0,hits:0,shots:0,learned:[]}]));
let skills = fresh(), current = 'sword', webTab = 'sword', selNode = null;
try {
  const s = JSON.parse(localStorage.getItem(STORE) || 'null');
  if (s && s.skills) {
    for (const k of ORDER) if (s.skills[k]) { const v=s.skills[k]; skills[k]={m:Math.max(0,Math.min(MAX,v.m|0)),hits:v.hits|0,shots:v.shots|0,learned:(v.learned||[]).filter(id=>NODES[k][id])}; }
    if (WEAPONS[s.current]) current = webTab = s.current;
  }
} catch(e) {}
const save = () => { try { localStorage.setItem(STORE, JSON.stringify({skills, current})); } catch(e) {} };
const earned = k => Math.floor(skills[k].m/STEP);
const freePts = k => earned(k) - skills[k].learned.length;
const pctTxt = m => (m/100).toFixed(2).replace('.',',')+'%';
let BONUS = {};
function computeBonus(k){ const b={acc:0,spd:0,dbl:0,move:0,focus:0,keys:new Set()}; for(const id of skills[k].learned){const n=NODES[k][id]; if(n.key) b.keys.add(n.key); else b[n.stat]+=n.val;} BONUS[k]=b; }
ORDER.forEach(computeBonus);

const hero = {x:120,y:280,r:13,face:0,state:'move',spot:null,cd:0.6,cdTotal:1,anim:0,animDur:0,resolved:true,attacksLeft:3,swap:0,bob:0,stuck:0,lastD:1e9,weapon:current,swingSign:1,attackNo:0,spin:false};
const dummy = {x:560,y:290,r:19,shake:0,flash:0,hitsLeft:6,move:null};
let projectiles=[], particles=[], floats=[], rings=[], timers=[];
let paused=false, speed=1, clock=0;

// ================= геометрия =================
const rnd=(a,b)=>a+Math.random()*(b-a);
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const inBounds=(p,m)=>p.x>m&&p.x<W-m&&p.y>m&&p.y<H-m;
const OBST_L=[{fx:.26,fy:.29,r:24,k:'barrel'},{fx:.734,fy:.223,r:30,k:'rock'},{fx:.182,fy:.75,r:28,k:'hay'},{fx:.802,fy:.768,r:22,k:'barrel'},{fx:.542,fy:.83,r:22,k:'rock'},{fx:.49,fy:.17,r:20,k:'barrel'}];
const OBST_P=[{fx:.25,fy:.3,r:24,k:'barrel'},{fx:.76,fy:.21,r:28,k:'rock'},{fx:.2,fy:.73,r:28,k:'hay'},{fx:.8,fy:.63,r:22,k:'barrel'},{fx:.56,fy:.87,r:22,k:'rock'}];
let OBST=[], POSTS=[], TORCHES=[], TREES=[];
function segBlocked(a,b,pad){ for(const o of OBST){ const dx=b.x-a.x,dy=b.y-a.y,L=dx*dx+dy*dy; let t=((o.x-a.x)*dx+(o.y-a.y)*dy)/L; t=Math.max(0,Math.min(1,t)); if(Math.hypot(a.x+dx*t-o.x,a.y+dy*t-o.y)<o.r+pad) return true; } return false; }
const freeSpot=(p,pad)=>inBounds(p,44)&&OBST.every(o=>Math.hypot(p.x-o.x,p.y-o.y)>o.r+pad);
function chooseSpot(){
  const w=WEAPONS[hero.weapon],[a,b]=w.range; let best=null,bs=-1;
  for(let i=0;i<60;i++){ const an=rnd(0,Math.PI*2),d=a+(b-a)*rnd(0.25,0.85); const p={x:dummy.x+Math.cos(an)*d,y:dummy.y+Math.sin(an)*d};
    if(!freeSpot(p,hero.r+8)) continue; if(w.type!=='melee'&&segBlocked(p,dummy,8)) continue;
    const sc=Math.min(dist(p,hero),260)+rnd(0,90); if(sc>bs){bs=sc;best=p;} }
  hero.spot=best||{x:dummy.x-(w.range[0]+4),y:dummy.y}; hero.state='move'; hero.stuck=0; hero.lastD=1e9;
  hero.attacksLeft=(w.type==='melee'?Math.round(rnd(3,6)):Math.round(rnd(2,4)))+BONUS[hero.weapon].focus;
}
function relocateDummy(){
  for(let i=0;i<80;i++){ const p={x:rnd(140,W-140),y:rnd(120,H-120)};
    if(freeSpot(p,70)&&dist(p,dummy)>170&&dist(p,hero)>90){ dummy.move={fx:dummy.x,fy:dummy.y,tx:p.x,ty:p.y,t:0}; addFloat(dummy.x,dummy.y-60,'Манекен переставили',COL.muted); return; } }
  dummy.hitsLeft=6;
}

// ================= эффекты =================
const COL={fg:'#f4e4bd',muted:'#d8c69c',accent:'#ffd36a',xp:'#9cf07a',miss:'#ff8a70',name:'#a8dcff'};
function addFloat(x,y,text,c,big){ if(floats.length<40) floats.push({x,y,text,c,life:1.3,big:!!big}); }
function burst(x,y,n,colors,spd){ if(particles.length>400) return; for(let i=0;i<n;i++){const a=rnd(0,Math.PI*2),s=rnd(spd*0.3,spd);particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rnd(0.4,0.9),c:colors[i%colors.length],sz:rnd(2,4)});} }

// ================= бой =================
function baseAcc(k){ return Math.min(1, START_ACC + 0.9*(skills[k].m/MAX) + BONUS[k].acc); }
const accTxt = v => String(Math.round(v*1000)/10).replace('.',',')+'%';
function accuracy(k,d){ const w=WEAPONS[k],b=BONUS[k]; let acc=baseAcc(k); if(w.type!=='melee'&&!b.keys.has('eagle')) acc*=1-Math.max(0,(d-w.range[0])/(w.range[1]-w.range[0]))*0.15; return Math.max(0.02,Math.min(1,acc)); }
function onHit(k,x,y,label){
  const s=skills[k]; s.hits++; dummy.shake=0.35; dummy.flash=0.18;
  burst(x,y,10,k==='staff'?['#9fc2ff','#d6e4ff','#f0b94e']:['#d8b56a','#b48a43','#efd9a3'],130);
  if(s.m<MAX){
    const before=earned(k); s.m+=1;
    addFloat(dummy.x+rnd(-10,10),dummy.y-60,(label?label+' ':'')+'+0,01%',label?COL.accent:COL.xp,!!label);
    if(earned(k)>before){ rings.push({x:hero.x,y:hero.y,t:0}); addFloat(hero.x,hero.y-118,'Новое очко навыка!',COL.accent,true);
      log(`${WEAPONS[k].name}: владение ${pctTxt(s.m)}. Получено очко навыка, свободно: ${freePts(k)}.`,'gold'); if(!winSkills.hidden) renderWeb(); }
    if(s.m===MAX) log(`${WEAPONS[k].name}: владение 100%. Полное мастерство.`,'gold');
  } else if(label) addFloat(dummy.x,dummy.y-60,label,COL.accent,true);
  if(k==='dagger'&&BONUS.dagger.keys.has('flurry')&&Math.random()<0.35&&hero.weapon==='dagger') hero.cd=Math.min(hero.cd,0.05);
  if(--dummy.hitsLeft<=0&&!dummy.move) relocateDummy();
  dirty=true;
}
function onMiss(k,x,y,why){ addFloat(x,y-20,why||'Промах',COL.miss); dirty=true; }
function startAttack(){
  const k=hero.weapon,w=WEAPONS[k],b=BONUS[k]; hero.attackNo++;
  hero.anim=0; hero.animDur=w.anim; hero.resolved=false;
  hero.spin=(k==='sword'&&b.keys.has('whirl')&&hero.attackNo%5===0);
  let cd=w.cd/(1+0.4*(skills[k].m/MAX))/(1+b.spd); if(k==='staff'&&b.keys.has('arcane')) cd*=0.8;
  hero.cd=cd+w.anim; hero.cdTotal=hero.cd; hero.swingSign*=-1;
}
function meleeStrike(k,label,auto){
  const w=WEAPONS[k],d=dist(hero,dummy),b=BONUS[k]; skills[k].shots++;
  const inR=d<=w.range[1]+8; let hit=inR&&(auto||Math.random()<accuracy(k,d));
  if(!hit&&inR&&b.keys.has('riposte')&&Math.random()<0.25){hit=true;label='Ответный удар';}
  if(hit) onHit(k,dummy.x+(hero.x<dummy.x?-8:8),dummy.y-4,label); else onMiss(k,dummy.x,dummy.y-30,Math.random()<0.5?'Промах':'Мимо');
  return hit;
}
function shoot(k,offset){
  const w=WEAPONS[k],d=dist(hero,dummy); skills[k].shots++;
  const hp=handPos(); const base=Math.atan2(dummy.y-hp.y,dummy.x-hp.x); let ang;
  if(Math.random()<accuracy(k,d)) ang=base+rnd(-0.02,0.02)+(offset||0)*0.15;
  else { const m=Math.asin(Math.min(1,(dummy.r+9)/d))+rnd(0.04,0.16); ang=base+(Math.random()<0.5?-m:m); }
  const sp=w.speed*(k==='staff'&&BONUS.staff.keys.has('arcane')?1.4:1);
  const sx=hp.x+Math.cos(ang)*6, sy=hp.y+Math.sin(ang)*6;
  projectiles.push({x:sx,y:sy,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,k,kind:w.type,life:1.6,trail:[]});
  if(w.type==='orb') burst(sx,sy,6,['#9fc2ff','#d6e4ff'],60);
}
function resolveAttack(){
  hero.resolved=true; const k=hero.weapon,w=WEAPONS[k],b=BONUS[k];
  if(w.type==='melee'){ const hit=meleeStrike(k,hero.spin?'Вихрь!':null,hero.spin);
    if(hit&&Math.random()<b.dbl) timers.push({t:0.13,fn:()=>{ if(hero.weapon===k) meleeStrike(k,'Двойной удар'); }}); }
  else {
    if(k==='bow'&&b.keys.has('volley')&&hero.attackNo%4===0){ shoot(k,-1);shoot(k,0);shoot(k,1); addFloat(hero.x,hero.y-118,'Залп!',COL.accent); } else shoot(k,0);
    if(Math.random()<b.dbl) timers.push({t:0.16,fn:()=>{ if(hero.weapon===k){ shoot(k,0); addFloat(hero.x,hero.y-118,k==='bow'?'Вторая стрела':'Вторая сфера',COL.fg);} }});
  }
  hero.attacksLeft--;
}

// ================= обновление =================
const angDiff=(a,b)=>{let d=b-a;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;return d;};
const lerpAng=(a,b,t)=>a+angDiff(a,b)*Math.min(1,t);
function step(dt){
  clock+=dt;
  timers=timers.filter(t=>{t.t-=dt;if(t.t<=0){t.fn();return false;}return true;});
  if(dummy.move){ const m=dummy.move; m.t=Math.min(1,m.t+dt/0.9); const e=m.t<.5?2*m.t*m.t:1-Math.pow(-2*m.t+2,2)/2;
    dummy.x=m.fx+(m.tx-m.fx)*e; dummy.y=m.fy+(m.ty-m.fy)*e; if(Math.random()<0.4) burst(dummy.x,dummy.y+14,1,['#8a7656'],40);
    if(m.t>=1){dummy.move=null;dummy.hitsLeft=Math.round(rnd(5,8));chooseSpot();} }
  dummy.shake=Math.max(0,dummy.shake-dt); dummy.flash=Math.max(0,dummy.flash-dt);
  hero.cd-=dt;
  if(hero.animDur){ hero.anim+=dt; if(!hero.resolved&&hero.anim>=hero.animDur*0.55) resolveAttack(); if(hero.anim>=hero.animDur) hero.animDur=0; }
  const k=hero.weapon,w=WEAPONS[k],b=BONUS[k];
  if(hero.state==='swap'){ hero.swap-=dt; if(hero.swap<=0) chooseSpot(); }
  else if(hero.state==='move'){
    const tx=hero.spot.x-hero.x,ty=hero.spot.y-hero.y,d=Math.hypot(tx,ty);
    if(d<5) hero.state='fight';
    else { let dx=tx/d,dy=ty/d;
      for(const o of [...OBST,{x:dummy.x,y:dummy.y,r:dummy.r}]){ const vx=hero.x-o.x,vy=hero.y-o.y,od=Math.hypot(vx,vy),lim=o.r+hero.r+28;
        if(od<lim&&od>0.01){ const f=(lim-od)/28*1.6,nx=vx/od,ny=vy/od,side=(nx*dy-ny*dx)>0?1:-1; dx+=nx*f+(-ny*side)*f*0.8; dy+=ny*f+(nx*side)*f*0.8; } }
      const n=Math.hypot(dx,dy)||1, shadow=k==='dagger'&&b.keys.has('shadowstep'), spd=150*(1+b.move)*(shadow?1.8:1);
      hero.x+=dx/n*spd*dt; hero.y+=dy/n*spd*dt;
      if(shadow&&Math.random()<0.5) particles.push({x:hero.x,y:hero.y,vx:0,vy:0,life:0.35,c:'rgba(40,36,60,.7)',sz:9,ghost:true});
      hero.face=lerpAng(hero.face,Math.atan2(dy,dx),dt*12); hero.bob+=dt*14*(spd/150);
      if(d<hero.lastD-0.5){hero.lastD=d;hero.stuck=0;} else if((hero.stuck+=dt)>1.2) chooseSpot(); }
  } else if(hero.state==='fight'){
    const target=Math.atan2(dummy.y-hero.y,dummy.x-hero.x); hero.face=lerpAng(hero.face,target,dt*14);
    const d=dist(hero,dummy), aligned=Math.abs(angDiff(hero.face,target))<0.15;
    if(dummy.move){}
    else if(d>w.range[1]+10||d<w.range[0]-12){ if(!hero.animDur) chooseSpot(); }
    else if(hero.cd<=0&&aligned&&!hero.animDur){ if(hero.attacksLeft<=0) chooseSpot(); else startAttack(); }
  }
  for(const o of [...OBST,{x:dummy.x,y:dummy.y,r:dummy.r}]){ const vx=hero.x-o.x,vy=hero.y-o.y,od=Math.hypot(vx,vy),lim=o.r+hero.r; if(od<lim&&od>0.01){hero.x=o.x+vx/od*lim;hero.y=o.y+vy/od*lim;} }
  hero.x=Math.max(30,Math.min(W-30,hero.x)); hero.y=Math.max(30,Math.min(H-30,hero.y));
  projectiles=projectiles.filter(p=>{
    p.trail.push({x:p.x,y:p.y}); if(p.trail.length>(p.kind==='orb'?10:5)) p.trail.shift();
    if(p.kind==='orb'&&BONUS.staff.keys.has('homing')){ const cur=Math.atan2(p.vy,p.vx),want=Math.atan2(dummy.y-p.y,dummy.x-p.x),sp=Math.hypot(p.vx,p.vy),na=cur+Math.max(-2.4*dt,Math.min(2.4*dt,angDiff(cur,want))); p.vx=Math.cos(na)*sp; p.vy=Math.sin(na)*sp; }
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.life-=dt;
    if(Math.hypot(p.x-dummy.x,p.y-dummy.y)<dummy.r+4){ onHit(p.k,p.x,p.y); return false; }
    for(const o of OBST) if(Math.hypot(p.x-o.x,p.y-o.y)<o.r){ onMiss(p.k,p.x,p.y,'В '+({barrel:'бочку',rock:'камень',hay:'сено'})[o.k]); burst(p.x,p.y,6,p.kind==='orb'?['#9fc2ff']:['#8a7656'],80); return false; }
    if(p.life<=0||!inBounds(p,6)){ onMiss(p.k,Math.max(40,Math.min(W-40,p.x)),Math.max(40,Math.min(H-40,p.y)),'Мимо'); return false; }
    return true; });
  particles=particles.filter(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=0.9;p.vy*=0.9;return (p.life-=dt)>0;});
  floats=floats.filter(f=>{f.y-=26*dt;return (f.life-=dt)>0;});
  rings=rings.filter(r=>(r.t+=dt)<0.9);
}

// ================= отрисовка: пиксельный буфер =================
const game=document.getElementById('game'), cv=document.getElementById('arena'), vctx=cv.getContext('2d');
const hudTop=document.getElementById('hud-top'), abEl=document.getElementById('actionbar');
const lb=document.createElement('canvas'), lctx=lb.getContext('2d');
const gb=document.createElement('canvas');
let ctx=lctx, dpr=1, s=1, ox=0, oy=0, P=2;
const worldT=c=>{ const k=s*dpr/P; c.setTransform(k,0,0,k,ox*dpr/P,oy*dpr/P); };
const scr=(x,y)=>[(x*s+ox)*dpr,(y*s+oy)*dpr];
function seeded(seed){ return ()=>((seed=(seed*16807)%2147483647)/2147483647); }

function setWorld(p){
  const oW=W,oH=H; portrait=p; W=p?540:960; H=p?700:560;
  OBST=(p?OBST_P:OBST_L).map(o=>({x:o.fx*W,y:o.fy*H,r:o.r,k:o.k}));
  hero.x*=W/oW; hero.y*=H/oH; dummy.x=W*0.55; dummy.y=H*0.5; dummy.move=null;
  projectiles=[];particles=[];floats=[];timers=[];hero.animDur=0;hero.resolved=true;
  POSTS=[]; const gap=34;
  for(let x=0;x<=W;x+=26){ POSTS.push({x,y:-4}); if(Math.abs(x-W/2)>gap) POSTS.push({x,y:H+4}); }
  for(let y=22;y<H;y+=26){ POSTS.push({x:-4,y}); POSTS.push({x:W+4,y}); }
  TORCHES=[{x:-16,y:-14},{x:W+16,y:-14},{x:W/2-gap-12,y:H+20},{x:W/2+gap+12,y:H+20}];
  const mm=document.getElementById('minimap'); mm.width=64; mm.height=Math.round(64*H/W);
  if(hero.spot) chooseSpot();
}
function layout(){
  dpr=Math.min(3,window.devicePixelRatio||1);
  const cw=game.clientWidth, ch=game.clientHeight;
  if(!cw||!ch) return;
  const p=cw/ch<0.9; if(p!==portrait||!OBST.length) setWorld(p);
  cv.width=Math.round(cw*dpr); cv.height=Math.round(ch*dpr);
  const topH=hudTop.offsetHeight+16, barH=abEl.offsetHeight, botH=barH+18;
  game.style.setProperty('--bar-h',barH+'px');
  const availH=Math.max(120,ch-topH-botH);
  s=Math.min((cw-20)/W,availH/(H+40)); ox=(cw-W*s)/2; oy=topH+(availH-H*s)/2+12*s;
  P=Math.max(2,Math.round(2*dpr));
  lb.width=Math.ceil(cv.width/P); lb.height=Math.ceil(cv.height/P); gb.width=lb.width; gb.height=lb.height;
  buildWorldDecor(cw,ch); buildGround(cw,ch);
}
function buildWorldDecor(cw,ch){
  const x0=-ox/s-60, x1=(cw-ox)/s+60, y0=-oy/s-40, y1=(ch-oy)/s+120, r=seeded(91);
  TREES=[];
  for(let gy=y0;gy<y1;gy+=62) for(let gx=x0;gx<x1;gx+=58){
    const x=gx+(r()-0.5)*40, y=gy+(r()-0.5)*36;
    if(x>-70&&x<W+70&&y>-60&&y<H+70) continue;
    if(Math.abs(x-W/2)<70&&y>H) continue;
    if(r()<0.18) continue;
    TREES.push({x,y,sz:0.8+r()*0.5,kind:r()<0.62?'pine':'oak'});

// ----- клавиатура -----
window.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ for(const w of [winSkills,winMenu]) if(!w.hidden) closeWin(w); return; }
  if(e.target.closest&&e.target.closest('button,.node,[role="button"]')&&(e.key===' '||e.key==='Enter')) return;
  const i=['1','2','3','4'].indexOf(e.key); if(i>=0) selectWeapon(ORDER[i]);
  if(e.key==='k'||e.key==='K'||e.key==='л'||e.key==='Л') winSkills.hidden?openWin(winSkills):closeWin(winSkills);
  if(e.key===' '){ e.preventDefault(); setPause(!paused); }
});
const isTouch = matchMedia('(pointer:coarse)').matches;
document.getElementById('controls-hint').textContent = isTouch
  ? 'Нажмите на оружие в нижней панели, чтобы сменить его. Портрет или кнопка «Навыки» открывают паутину. Нажатие на чат разворачивает его.'
  : 'Клавиши 1–4 меняют оружие, K открывает паутину навыков, пробел ставит паузу, Esc закрывает окна. Клик по чату разворачивает его.';

// ================= цикл =================
let last=performance.now(), lastSlow=0;
function frame(now){
  const raw=Math.min(0.05,(now-last)/1000); last=now;
  if(!paused) for(let i=0;i<speed;i++) step(raw);
  if(cv.width) drawScene();
  const cdEl=document.querySelector(`#s-${current} .cd`); if(cdEl) cdEl.style.setProperty('--cd',Math.max(0,Math.min(1,hero.cd/(hero.cdTotal||1))).toFixed(3));
  if(now-lastSlow>160){ lastSlow=now; renderMinimap(); renderPortrait(); if(dirty){ dirty=false; save(); if(!winSkills.hidden&&webSig()!==lastWebSig) renderWeb(); } renderHUD(); }
  requestAnimationFrame(frame);
}
renderHUD();
new ResizeObserver(()=>layout()).observe(game);
if(document.fonts&&document.fonts.load) document.fonts.load('600 14px "Pixelify Sans"').then(()=>layout()).catch(()=>{});
layout(); chooseSpot(); renderPortrait();
log(`${HERO_NAME} выходит на тренировочный двор. В руках: ${WEAPONS[current].acc4}.`,'sys');
let wakeLock=null;
async function keepAwake(){ try{ if('wakeLock' in navigator&&!wakeLock&&!document.hidden){ wakeLock=await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release',()=>{wakeLock=null;}); } }catch(e){} }
window.addEventListener('pointerdown',keepAwake);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden){ last=performance.now(); keepAwake(); } });
requestAnimationFrame(frame);
})();
</script>
</body>
